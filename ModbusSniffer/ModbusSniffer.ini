; ModbusSniffer serial and timing settings
PortName=COM6
BaudRate=57600
Parity=None
DataBits=8
StopBits=One
Handshake=None

; Control-line state held for the whole session. This is a passive tap, so keep
; RtsEnable=false (never key the RS-485 driver). Leave DtrEnable=false unless your
; adapter needs DTR asserted. If the mouse pointer jumps while capturing, that is
; Windows detecting a phantom serial mouse on the port; keep this program running
; for the whole capture and, if needed, turn off "Serial Enumerator" in Device
; Manager under the port's Port Settings, Advanced.
DtrEnable=false
RtsEnable=false

; Because the serial character time cannot be determined reliably over USB, these
; settings provide approximate timeouts for partial frames and master delays.

; Time to wait for the next USB transmission while receiving a response or partial
; frame before considering the data incomplete or missing bytes.
PartialFrameTimeoutMilliseconds=100

; Threshold for considering a delay between requests from the master significant.
; In my case, this indicates that the master received an error or timed out.
; Set this to a higher value if it does not fit your application.
MasterDelayThresholdMilliseconds=400

; Intra-frame USB read gap (in milliseconds) at or above which a frame is flagged
; SUSPECT_GAP - an approximation of the Modbus t3.5 end-of-frame silence that
; makes the receiving device treat a frame as finished. 0 lets the sniffer derive
; it from the baud rate: 1.75 ms above 19200 baud (fixed by the Modbus spec),
; otherwise 3.5 character times. This is a host-side USB-delivery gap, not a true
; on-wire measurement - treat a flag as a lead to correlate, not proof.
FrameGapSuspectMilliseconds=0

; Latency timer (in milliseconds) to program into an FTDI adapter through the
; D2XX API at startup, before the port is opened. The FTDI driver resets this to
; 16 ms on every reboot, replug, or USB-port change, so it is re-applied on every
; run. 1 is the lowest useful value; 0 disables the D2XX call (use for non-FTDI
; adapters, or to keep whatever the driver/registry already set).
FtdiLatencyTimerMilliseconds=1
