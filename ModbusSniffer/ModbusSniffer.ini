; ModbusSniffer serial and timing settings
PortName=COM6
BaudRate=57600
Parity=None
DataBits=8
StopBits=One
Handshake=None

; Because the serial character time cannot be determined reliably over USB, these
; settings provide approximate timeouts for partial frames and master delays.

; Time to wait for the next USB transmission while receiving a response or partial
; frame before considering the data incomplete or missing bytes.
PartialFrameTimeoutMilliseconds=100

; Threshold for considering a delay between requests from the master significant.
; In my case, this indicates that the master received an error or timed out.
; Set this to a higher value if it does not fit your application.
MasterDelayThresholdMilliseconds=400
